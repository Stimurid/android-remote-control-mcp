name: One-time Kotlin formatting for Android TTS branch
on:
  push:
    branches:
      - feature/android-exact-tts
    paths:
      - .github/workflows/tts-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'Stimurid/android-remote-control-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-exact-tts
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply upstream ktlint formatting
        run: ./gradlew ktlintFormat
      - name: Commit only Android TTS feature source and tests
        run: |
          git add app/src/main/kotlin/com/danielealbano/androidremotecontrolmcp/mcp/tools/ExactTtsTools.kt
          git add app/src/main/kotlin/com/danielealbano/androidremotecontrolmcp/services/tts
          git add app/src/main/kotlin/com/danielealbano/androidremotecontrolmcp/services/mcp/McpServerService.kt
          git add app/src/main/kotlin/com/danielealbano/androidremotecontrolmcp/services/mcp/McpToolRegistration.kt
          git add app/src/test/kotlin/com/danielealbano/androidremotecontrolmcp/services/tts
          git add app/src/test/kotlin/com/danielealbano/androidremotecontrolmcp/services/mcp/McpToolRegistrationTest.kt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply upstream ktlint formatting to Android TTS"
            git push origin HEAD:feature/android-exact-tts
          fi
